name: Release

on:
  push:
    tags:
      - "v*"
  # Build-only dry run: lets the build matrix be exercised from any branch without
  # burning a tag. The release job is tag-gated, so nothing is published.
  workflow_dispatch:

# Restrict permissions - only release job needs write access
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # crates.io downloads occasionally return partial files ([18] curl error);
  # retry instead of failing the whole build.
  CARGO_NET_RETRY: 10

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: oitec
            asset_name: oitec-x86_64-apple-darwin

          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: oitec
            asset_name: oitec-aarch64-apple-darwin

          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: oitec
            asset_name: oitec-x86_64-unknown-linux-gnu

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            artifact_name: oitec
            asset_name: oitec-aarch64-unknown-linux-gnu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install LLVM 18 (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          # Install LLVM 18 dev headers, Polly, and zstd from the distro repo.
          # See ci.yml for why we avoid apt.llvm.org's llvm.sh (it upgrades libllvm18
          # to a snapshot that Breaks the distro llvm-18-dev). The arm64 runner image
          # preinstalls no LLVM, so the dev headers must be installed explicitly.
          sudo apt-get update
          sudo apt-get install -y llvm-18-dev libpolly-18-dev libzstd-dev
          echo "LLVM_SYS_180_PREFIX=/usr/lib/llvm-18" >> "$GITHUB_ENV"

      - name: Install LLVM 18 (macOS aarch64)
        if: runner.os == 'macOS' && matrix.target == 'aarch64-apple-darwin'
        run: |
          # Remove any pre-installed x86_64 LLVM that could interfere
          sudo rm -rf /usr/local/opt/llvm@18 /usr/local/opt/llvm || true
          brew install llvm@18 zstd
          # Use explicit ARM Homebrew path
          echo "LLVM_SYS_180_PREFIX=/opt/homebrew/opt/llvm@18" >> $GITHUB_ENV

      - name: Install LLVM 18 (macOS x86_64 cross-compile)
        if: runner.os == 'macOS' && matrix.target == 'x86_64-apple-darwin'
        run: |
          # llvm-sys needs an LLVM built for the *target* (x86_64), not for the arm64
          # host. Homebrew no longer supports Intel macOS -- its installer aborts under
          # `arch -x86_64` -- so the x86_64 LLVM 18 and zstd come from conda-forge's
          # osx-64 channel, fetched by the host's (arm64) micromamba.
          brew install micromamba
          export MAMBA_ROOT_PREFIX="$RUNNER_TEMP/mamba"
          CONDA_ENV="$RUNNER_TEMP/conda-x86_64"
          micromamba create -y -p "$CONDA_ENV" --platform osx-64 \
            --override-channels -c conda-forge llvmdev=18.1.8 zstd-static=1.5.7

          # Link against a prefix holding only llvm-config, the headers and the static
          # archives. llvm-sys puts <prefix>/lib on the linker search path, and the conda
          # env's lib/ also holds libc++, libz, libxml2 and libzstd dylibs whose install
          # names are @rpath-relative: picked up by -lc++/-lz/-lxml2/-lzstd they would
          # leave oitec depending on libraries end-user machines do not have. With only
          # .a files here, zstd links statically and the rest resolve to the macOS SDK.
          LLVM_PREFIX="$RUNNER_TEMP/llvm18-x86_64"
          mkdir -p "$LLVM_PREFIX/bin" "$LLVM_PREFIX/lib"
          cp "$CONDA_ENV/bin/llvm-config" "$LLVM_PREFIX/bin/"
          cp -R "$CONDA_ENV/include" "$LLVM_PREFIX/include"
          cp "$CONDA_ENV"/lib/libLLVM*.a "$CONDA_ENV/lib/libzstd.a" "$LLVM_PREFIX/lib/"

          # llvm-config is itself an x86_64 binary (run through Rosetta) that loads
          # @rpath/libc++.1.dylib from ../lib. Only the versioned names are copied, so
          # the linker's -lc++ lookup (libc++.dylib / libc++.a) still misses them.
          for lib in libc++.1.dylib libc++abi.1.dylib; do
            if [ -e "$CONDA_ENV/lib/$lib" ]; then
              cp -L "$CONDA_ENV/lib/$lib" "$LLVM_PREFIX/lib/"
            fi
          done

          # Verify: llvm-config runs, and the archives are x86_64
          "$LLVM_PREFIX/bin/llvm-config" --version
          "$LLVM_PREFIX/bin/llvm-config" --link-static --system-libs
          lipo -info "$LLVM_PREFIX/lib/libLLVMCore.a" "$LLVM_PREFIX/lib/libzstd.a"

          echo "LLVM_SYS_180_PREFIX=$LLVM_PREFIX" >> "$GITHUB_ENV"
          rustup target add x86_64-apple-darwin

          # Note: the linker stays Apple's clang (rustc's default `cc`). It links x86_64
          # from an arm64 host natively (rustc passes -arch x86_64) and locates the macOS
          # SDK on its own -- libm/libSystem exist only as .tbd stubs inside the SDK.

      - name: Cache cargo registry
        uses: actions/cache@v4 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ matrix.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.os }}-${{ matrix.target }}-cargo-

      - name: Build release binary (x86_64 macOS)
        if: matrix.target == 'x86_64-apple-darwin'
        run: |
          # Clean any cached artifacts that might have wrong architecture
          cargo clean

          export MACOSX_DEPLOYMENT_TARGET=14.0

          # Link with Apple's clang (rustc's default `cc`). It cross-links x86_64 from an
          # arm64 host and finds the SDK by itself. The only library directory it is
          # pointed at is the x86_64 LLVM prefix, which holds static archives only
          # (LLVM and libzstd.a), so the binary gets no runtime dependency on
          # libzstd.1.dylib or any other non-system library.
          LLVM_LIB="$LLVM_SYS_180_PREFIX/lib"
          export LIBRARY_PATH="$LLVM_LIB"
          export CARGO_TARGET_X86_64_APPLE_DARWIN_RUSTFLAGS="-C link-arg=-arch -C link-arg=x86_64 -C link-arg=-L$LLVM_LIB -C link-arg=-mmacosx-version-min=14.0"

          cargo build --release --target ${{ matrix.target }}

          # Everything the binary loads must ship with macOS.
          BIN=target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
          lipo -info "$BIN"
          otool -L "$BIN"
          if otool -L "$BIN" | tail -n +2 | grep -v -E '^[[:space:]]+(/usr/lib/|/System/Library/)'; then
            echo "ERROR: binary depends on a non-system library" >&2
            exit 1
          fi

      - name: Build release binary
        if: matrix.target != 'x86_64-apple-darwin' && matrix.target != 'aarch64-apple-darwin'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Run tests
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --release --target ${{ matrix.target }}

      - name: Force static libzstd (macOS aarch64)
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          # llvm-sys links zstd via `-lzstd`; macOS ld prefers libzstd.dylib over
          # libzstd.a when both are present, baking a dependency on the Homebrew path
          # /opt/homebrew/opt/zstd/lib/libzstd.1.dylib that is absent on end-user
          # machines. llvm-config itself loads libzstd at runtime, so the dylib must
          # stay until after the build/test phase; only then can we remove it and
          # relink the final binary so ld falls back to the static libzstd.a.
          sudo rm -f /opt/homebrew/opt/zstd/lib/libzstd*.dylib /opt/homebrew/lib/libzstd*.dylib
          touch src/main.rs
          cargo build --release --target ${{ matrix.target }}

      - name: Strip binary (Linux)
        if: runner.os == 'Linux'
        run: strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

      - name: Verify no dynamic zstd dependency (macOS)
        if: runner.os == 'macOS'
        run: |
          if otool -L target/${{ matrix.target }}/release/${{ matrix.artifact_name }} | grep -q libzstd; then
            echo "ERROR: binary still dynamically links to libzstd" >&2
            otool -L target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
            exit 1
          fi
          echo "OK: no dynamic zstd dependency"

      - name: Strip binary (macOS)
        if: runner.os == 'macOS'
        run: strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

      - name: Create tarball
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../${{ matrix.asset_name }}.tar.gz ${{ matrix.artifact_name }}
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@v4 # v4.6.2
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}.tar.gz
          retention-days: 1

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Publish only for tag pushes. A workflow_dispatch run has no tag, so the version
    # below would resolve to a branch ref and cut a bogus release.
    if: startsWith(github.ref, 'refs/tags/')
    # Only this job needs write permissions
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6 # v4.2.2
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@v4 # v4.3.0
        with:
          path: artifacts

      - name: List artifacts
        run: ls -laR artifacts/

      # What the release ships with is pinned in scripts/release-pins.env.
      - name: Read release pins
        id: pins
        run: |
          . scripts/release-pins.env
          echo "unroll=$UNROLL_REF" >> "$GITHUB_OUTPUT"
          echo "rolls=$ROLLS_REF" >> "$GITHUB_OUTPUT"

      - name: Bundle unroll source
        env:
          UNROLL_REF: ${{ steps.pins.outputs.unroll }}
        run: |
          git init -q unroll-src-repo
          git -C unroll-src-repo fetch -q --depth 1 https://github.com/warpy-ai/unroll.git "$UNROLL_REF"
          git -C unroll-src-repo checkout -q FETCH_HEAD
          mkdir -p unroll-src
          cp -r unroll-src-repo/src unroll-src/
          cp unroll-src-repo/unroll.toml unroll-src/ 2>/dev/null || true
          tar -czf unroll-src.tar.gz -C unroll-src .
          rm -rf unroll-src-repo unroll-src

      # warpy-ai/rolls is private: ROLLS_READ_TOKEN is a token that can read it.
      - name: Check out the core rolls
        uses: actions/checkout@v6 # v4.2.2
        with:
          repository: warpy-ai/rolls
          ref: ${{ steps.pins.outputs.rolls }}
          token: ${{ secrets.ROLLS_READ_TOKEN }}
          path: rolls-src
          persist-credentials: false

      - name: Bundle the core rolls
        run: scripts/bundle-core-rolls.sh rolls-src core-rolls.tar.gz

      - name: Generate checksums
        run: |
          cd artifacts
          for dir in */; do
            for file in "$dir"*.tar.gz; do
              if [ -f "$file" ]; then
                sha256sum "$file" >> checksums.txt
              fi
            done
          done
          cd ..
          sha256sum unroll-src.tar.gz >> artifacts/checksums.txt
          sha256sum core-rolls.tar.gz >> artifacts/checksums.txt
          sha256sum scripts/install.sh >> artifacts/checksums.txt
          cat artifacts/checksums.txt
          mv artifacts/checksums.txt .

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2 # v2.2.2
        with:
          name: Oite ${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            unroll-src.tar.gz
            core-rolls.tar.gz
            scripts/install.sh
            checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
