name: Release

on:
  push:
    tags:
      - "v*"
  # Build-only dry run: lets the build matrix be exercised from any branch without
  # burning a tag. The release job is tag-gated, so nothing is published.
  workflow_dispatch:

# Restrict permissions - only release job needs write access
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # crates.io downloads occasionally return partial files ([18] curl error);
  # retry instead of failing the whole build.
  CARGO_NET_RETRY: 10

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            conda_platform: osx-64
            artifact_name: oitec
            asset_name: oitec-x86_64-apple-darwin

          - target: aarch64-apple-darwin
            os: macos-latest
            conda_platform: osx-arm64
            artifact_name: oitec
            asset_name: oitec-aarch64-apple-darwin

          # The Linux binaries are built on the oldest Ubuntu image offered: a binary
          # needs at least the glibc it was built against, so building on 24.04 gave
          # binaries that could not start on Ubuntu 22.04 or Debian 12.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            artifact_name: oitec
            asset_name: oitec-x86_64-unknown-linux-gnu

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            artifact_name: oitec
            asset_name: oitec-aarch64-unknown-linux-gnu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install LLVM 18 (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          # Ubuntu 22.04 has no LLVM 18 of its own, so it comes from apt.llvm.org's
          # repository for 22.04 (jammy). ci.yml avoids apt.llvm.org on 24.04 because
          # its packages clash with the distro's LLVM 18 there; 22.04 has none to
          # clash with.
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-18 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-18.list
          sudo apt-get update
          sudo apt-get install -y llvm-18-dev libpolly-18-dev libzstd-dev
          /usr/lib/llvm-18/bin/llvm-config --version
          echo "LLVM_SYS_180_PREFIX=/usr/lib/llvm-18" >> "$GITHUB_ENV"

      - name: Install LLVM 18 (macOS)
        if: runner.os == 'macOS'
        run: |
          # The release binary must run on a Mac that has no Homebrew and no LLVM, so
          # it may load nothing but what ships with macOS. Homebrew's llvm@18 cannot
          # give that: its lib/ carries libunwind/libc++ dylibs whose install names
          # point back into /opt/homebrew, and linking against it left oitec needing
          # /opt/homebrew/opt/llvm@18/lib/libunwind.1.dylib at startup. Homebrew also
          # no longer supports Intel macOS at all (its installer aborts under
          # `arch -x86_64`), and llvm-sys needs an LLVM built for the *target*.
          #
          # So both macOS targets take LLVM 18 and zstd from conda-forge, for the
          # target's platform, fetched by the host's micromamba.
          brew install micromamba
          export MAMBA_ROOT_PREFIX="$RUNNER_TEMP/mamba"
          CONDA_ENV="$RUNNER_TEMP/conda-llvm"
          micromamba create -y -p "$CONDA_ENV" --platform ${{ matrix.conda_platform }} \
            --override-channels -c conda-forge llvmdev=18.1.8 zstd-static=1.5.7

          # Link against a prefix holding only llvm-config, the headers and the static
          # archives. llvm-sys puts <prefix>/lib on the linker search path, and the conda
          # env's lib/ also holds libc++, libz, libxml2 and libzstd dylibs whose install
          # names are @rpath-relative: picked up by -lc++/-lz/-lxml2/-lzstd they would
          # leave oitec depending on libraries end-user machines do not have. With only
          # .a files here, zstd links statically and the rest resolve to the macOS SDK.
          LLVM_PREFIX="$RUNNER_TEMP/llvm18"
          mkdir -p "$LLVM_PREFIX/bin" "$LLVM_PREFIX/lib"
          cp "$CONDA_ENV/bin/llvm-config" "$LLVM_PREFIX/bin/"
          cp -R "$CONDA_ENV/include" "$LLVM_PREFIX/include"
          cp "$CONDA_ENV"/lib/libLLVM*.a "$CONDA_ENV/lib/libzstd.a" "$LLVM_PREFIX/lib/"

          # llvm-config (for x86_64, run through Rosetta) loads @rpath/libc++.1.dylib
          # from ../lib. Only the versioned names are copied, so the linker's -lc++
          # lookup (libc++.dylib / libc++.a) still misses them.
          for lib in libc++.1.dylib libc++abi.1.dylib; do
            if [ -e "$CONDA_ENV/lib/$lib" ]; then
              cp -L "$CONDA_ENV/lib/$lib" "$LLVM_PREFIX/lib/"
            fi
          done

          # `oitec build --release` (exercised by the tests) runs the LLVM command-line
          # tools from $LLVM_SYS_180_PREFIX/bin. They load the conda env's dylibs, so
          # they stay in that env; the prefix only gets wrappers that exec them.
          for tool in opt llc llvm-link llvm-lto; do
            printf '#!/bin/sh\nexec "%s/bin/%s" "$@"\n' "$CONDA_ENV" "$tool" > "$LLVM_PREFIX/bin/$tool"
            chmod +x "$LLVM_PREFIX/bin/$tool"
            test -x "$CONDA_ENV/bin/$tool"
          done

          # Verify: llvm-config runs, and the archives are for the target
          "$LLVM_PREFIX/bin/llvm-config" --version
          "$LLVM_PREFIX/bin/llvm-config" --link-static --system-libs
          lipo -info "$LLVM_PREFIX/lib/libLLVMCore.a" "$LLVM_PREFIX/lib/libzstd.a"

          # .cargo/config.toml puts /opt/homebrew/opt/zstd/lib first on the linker search
          # path. A libzstd.dylib there wins over the static archive: on arm64 it becomes
          # a runtime dependency on Homebrew, and for x86_64 ld skips it for its
          # architecture and then never reaches libzstd.a. Take it away (after
          # micromamba, which may itself load it, has finished).
          sudo rm -rf /opt/homebrew/opt/zstd

          echo "LLVM_SYS_180_PREFIX=$LLVM_PREFIX" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$LLVM_PREFIX/lib" >> "$GITHUB_ENV"

          # Note: the linker stays Apple's clang (rustc's default `cc`). It links x86_64
          # from an arm64 host natively (rustc passes -arch x86_64) and locates the macOS
          # SDK on its own -- libm/libSystem exist only as .tbd stubs inside the SDK.

      - name: Cache cargo registry
        uses: actions/cache@v4 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ matrix.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.os }}-${{ matrix.target }}-cargo-

      - name: Build release binary (x86_64 macOS)
        if: matrix.target == 'x86_64-apple-darwin'
        run: |
          # Clean any cached artifacts that might have wrong architecture
          cargo clean

          export MACOSX_DEPLOYMENT_TARGET=14.0

          # Link with Apple's clang (rustc's default `cc`). It cross-links x86_64 from an
          # arm64 host and finds the SDK by itself. The only library directory it is
          # pointed at is the x86_64 LLVM prefix, which holds static archives only.
          LLVM_LIB="$LLVM_SYS_180_PREFIX/lib"
          export CARGO_TARGET_X86_64_APPLE_DARWIN_RUSTFLAGS="-C link-arg=-arch -C link-arg=x86_64 -C link-arg=-L$LLVM_LIB -C link-arg=-mmacosx-version-min=14.0"

          cargo build --release --target ${{ matrix.target }}

      - name: Build release binary
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Run tests
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --release --target ${{ matrix.target }}

      - name: Strip binary (Linux)
        if: runner.os == 'Linux'
        run: strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

      - name: Verify the glibc the binary needs (Linux)
        if: runner.os == 'Linux'
        run: |
          # The newest glibc version any symbol of oitec asks for is the oldest glibc
          # it can start on. Building on a newer image would raise it unnoticed.
          BIN=target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
          ldd "$BIN"
          needed=$(objdump -T "$BIN" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "oitec needs $needed"
          newest=$(printf '%s\n' "$needed" GLIBC_2.35 | sort -V | tail -1)
          if [ "$newest" != GLIBC_2.35 ]; then
            echo "ERROR: oitec needs $needed; it must start on glibc 2.35 (Ubuntu 22.04)" >&2
            exit 1
          fi

      - name: Verify the binary is self-contained (macOS)
        if: runner.os == 'macOS'
        run: |
          # Everything oitec loads must ship with macOS: a dependency on Homebrew, conda
          # or any other build-machine path aborts at startup on an end-user Mac.
          BIN=target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
          lipo -info "$BIN"
          otool -L "$BIN"
          if otool -L "$BIN" | tail -n +2 | grep -v -E '^[[:space:]]+(/usr/lib/|/System/Library/)'; then
            echo "ERROR: binary depends on a non-system library (listed above)" >&2
            exit 1
          fi
          echo "OK: only system libraries"

          # And it must actually start (x86_64 runs through Rosetta). oitec has no
          # --version flag, so only the loader's verdict counts: a dyld failure aborts
          # with a signal (status >= 126), an ordinary usage error exits with 1 or 2.
          status=0
          "$BIN" --version || status=$?
          if [ "$status" -ge 126 ]; then
            echo "ERROR: oitec failed to start (exit status $status)" >&2
            exit 1
          fi
          echo "OK: oitec starts (exit status $status)"

      - name: Strip binary (macOS)
        if: runner.os == 'macOS'
        run: strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

      - name: Create tarball
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../${{ matrix.asset_name }}.tar.gz ${{ matrix.artifact_name }}
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@v4 # v4.6.2
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}.tar.gz
          retention-days: 1

  # A user's machine has no checkout, no LLVM and no Homebrew, and may be older
  # than the image a binary was built on. So each binary is also run, exactly as
  # downloaded, on other machines: the oldest macOS images offered, the Ubuntu
  # the Linux binaries are built for, and a Debian 12 container.
  smoke:
    name: Run ${{ matrix.asset_name }} on ${{ matrix.container || matrix.os }}
    needs: build
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            asset_name: oitec-aarch64-apple-darwin
          - os: macos-15-intel
            asset_name: oitec-x86_64-apple-darwin
          - os: ubuntu-22.04
            asset_name: oitec-x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            asset_name: oitec-aarch64-unknown-linux-gnu
          - os: ubuntu-latest
            container: debian:12
            asset_name: oitec-x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            container: debian:12
            asset_name: oitec-aarch64-unknown-linux-gnu
    steps:
      - name: Download the binary
        uses: actions/download-artifact@v4 # v4.3.0
        with:
          name: ${{ matrix.asset_name }}

      - name: Install a C compiler (container)
        if: matrix.container != ''
        run: |
          # A native build links with the system's C compiler; a bare container
          # has none.
          apt-get update
          apt-get install -y gcc

      - name: Run it
        run: |
          tar -xzf ${{ matrix.asset_name }}.tar.gz
          if [ "$(uname)" = Darwin ]; then sw_vers; otool -L oitec; else cat /etc/os-release; ldd oitec; fi

          printf 'function add(a: number, b: number): number { return a + b; }\nconsole.log("sum", add(2, 3));\n' > hello.ot

          echo "--- interpreter"
          ./oitec hello.ot | tee run.out
          grep -q "sum 5" run.out

          echo "--- native build"
          ./oitec build hello.ot -o hello
          ./hello | tee native.out
          grep -q "sum 5" native.out

  release:
    name: Create Release
    needs: [build, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Publish only for tag pushes. A workflow_dispatch run has no tag, so the version
    # below would resolve to a branch ref and cut a bogus release.
    if: startsWith(github.ref, 'refs/tags/')
    # Only this job needs write permissions
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6 # v4.2.2
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@v4 # v4.3.0
        with:
          path: artifacts

      - name: List artifacts
        run: ls -laR artifacts/

      # What the release ships with is pinned in scripts/release-pins.env.
      - name: Read release pins
        id: pins
        run: |
          . scripts/release-pins.env
          echo "unroll=$UNROLL_REF" >> "$GITHUB_OUTPUT"
          echo "rolls=$ROLLS_REF" >> "$GITHUB_OUTPUT"

      - name: Bundle unroll source
        env:
          UNROLL_REF: ${{ steps.pins.outputs.unroll }}
        run: |
          git init -q unroll-src-repo
          git -C unroll-src-repo fetch -q --depth 1 https://github.com/warpy-ai/unroll.git "$UNROLL_REF"
          git -C unroll-src-repo checkout -q FETCH_HEAD
          mkdir -p unroll-src
          cp -r unroll-src-repo/src unroll-src/
          cp unroll-src-repo/unroll.toml unroll-src/ 2>/dev/null || true
          tar -czf unroll-src.tar.gz -C unroll-src .
          rm -rf unroll-src-repo unroll-src

      # warpy-ai/rolls is private: ROLLS_READ_TOKEN is a token that can read it.
      - name: Check out the core rolls
        uses: actions/checkout@v6 # v4.2.2
        with:
          repository: warpy-ai/rolls
          ref: ${{ steps.pins.outputs.rolls }}
          token: ${{ secrets.ROLLS_READ_TOKEN }}
          path: rolls-src
          persist-credentials: false

      - name: Bundle the core rolls
        run: scripts/bundle-core-rolls.sh rolls-src core-rolls.tar.gz

      - name: Generate checksums
        run: |
          cd artifacts
          for dir in */; do
            for file in "$dir"*.tar.gz; do
              if [ -f "$file" ]; then
                sha256sum "$file" >> checksums.txt
              fi
            done
          done
          cd ..
          sha256sum unroll-src.tar.gz >> artifacts/checksums.txt
          sha256sum core-rolls.tar.gz >> artifacts/checksums.txt
          sha256sum scripts/install.sh >> artifacts/checksums.txt
          cat artifacts/checksums.txt
          mv artifacts/checksums.txt .

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2 # v2.2.2
        with:
          name: Oite ${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            unroll-src.tar.gz
            core-rolls.tar.gz
            scripts/install.sh
            checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
