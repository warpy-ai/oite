name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

# Restrict default permissions - principle of least privilege
permissions:
  contents: read

# Cancel in-progress runs for same PR/branch to save resources
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # crates.io downloads occasionally return partial files ([18] curl error);
  # retry instead of failing the whole build.
  CARGO_NET_RETRY: 10

jobs:
  test:
    name: Test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    # Limit job execution time to prevent resource abuse
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: oitec
            asset_name: oitec-x86_64-apple-darwin

          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: oitec
            asset_name: oitec-aarch64-apple-darwin

          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: oitec
            asset_name: oitec-x86_64-unknown-linux-gnu

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            artifact_name: oitec
            asset_name: oitec-aarch64-unknown-linux-gnu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6 # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Install LLVM 18 (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          # Ubuntu 24.04 (noble) ships LLVM 18 natively, so install the dev headers
          # (llvm-c/Target.h, needed by llvm-sys), Polly, and zstd from the distro repo.
          # We deliberately avoid apt.llvm.org's llvm.sh: it upgrades libllvm18 to a
          # snapshot build that Breaks the distro llvm-18-dev, which produces
          # unmet-dependency failures (notably on the arm64 runner, whose image
          # preinstalls no LLVM).
          sudo apt-get update
          sudo apt-get install -y llvm-18-dev libpolly-18-dev libzstd-dev
          echo "LLVM_SYS_180_PREFIX=/usr/lib/llvm-18" >> "$GITHUB_ENV"

      - name: Install LLVM 18 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@18 zstd
          echo "LLVM_SYS_180_PREFIX=$(brew --prefix llvm@18)" >> $GITHUB_ENV

      - name: Cache cargo registry
        uses: actions/cache@v4 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.os }}-${{ matrix.target }}-cargo-

      - name: Build
        run: cargo build --release

      - name: Run Rust tests
        run: cargo test --release

      - name: Run bootstrap verification
        run: |
          chmod +x scripts/bootstrap_verify.sh
          scripts/bootstrap_verify.sh

  core-rolls:
    name: Core rolls (vm, jit, aot)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # warpy-ai/rolls is private: ROLLS_READ_TOKEN can read it. Pull requests
      # from forks get no secrets, so there the job reports a warning instead.
      HAS_ROLLS_TOKEN: ${{ secrets.ROLLS_READ_TOKEN != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6 # v6
        with:
          persist-credentials: false

      # The rolls a release bundles: ROLLS_REF in scripts/release-pins.env.
      - name: Read release pins
        id: pins
        run: |
          . scripts/release-pins.env
          echo "rolls=$ROLLS_REF" >> "$GITHUB_OUTPUT"

      - name: No token for warpy-ai/rolls
        if: env.HAS_ROLLS_TOKEN != 'true'
        run: echo "::warning::ROLLS_READ_TOKEN is not available; the core rolls were not tested"

      - name: Check out the core rolls
        if: env.HAS_ROLLS_TOKEN == 'true'
        uses: actions/checkout@v6 # v6
        with:
          repository: warpy-ai/rolls
          ref: ${{ steps.pins.outputs.rolls }}
          token: ${{ secrets.ROLLS_READ_TOKEN }}
          path: rolls-src
          persist-credentials: false

      - name: Install Rust toolchain
        if: env.HAS_ROLLS_TOKEN == 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Install LLVM 18
        if: env.HAS_ROLLS_TOKEN == 'true'
        run: |
          # Use the distro's native LLVM 18 (see the test job for why we avoid llvm.sh).
          sudo apt-get update
          sudo apt-get install -y llvm-18-dev libpolly-18-dev libzstd-dev
          echo "LLVM_SYS_180_PREFIX=/usr/lib/llvm-18" >> "$GITHUB_ENV"

      - name: Cache cargo registry
        if: env.HAS_ROLLS_TOKEN == 'true'
        uses: actions/cache@v4 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-latest-x86_64-unknown-linux-gnu-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ubuntu-latest-x86_64-unknown-linux-gnu-cargo-

      # tests/core_rolls/: programs that import the core rolls, each run on
      # the VM, the JIT and as a native binary (tests/golden.rs).
      - name: Run the core rolls on every backend
        if: env.HAS_ROLLS_TOKEN == 'true'
        env:
          OITE_CORE_ROLLS: ${{ github.workspace }}/rolls-src
        run: |
          cargo test --release --test golden core_rolls
          # The type checker must find nothing in the core rolls either.
          cargo test --release --test type_check existing_code_has_no_findings

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6 # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install LLVM 18
        run: |
          # Use the distro's native LLVM 18 (see the test job for why we avoid llvm.sh).
          sudo apt-get update
          sudo apt-get install -y llvm-18-dev libpolly-18-dev libzstd-dev
          echo "LLVM_SYS_180_PREFIX=/usr/lib/llvm-18" >> "$GITHUB_ENV"

      - name: Cache cargo registry
        uses: actions/cache@v4 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ubuntu-cargo-lint-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings
